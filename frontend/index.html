<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoiceQL</title>

    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --border: #e6e8ec;
            --text: #14161a;
            --muted: #6b7280;
            --accent: #4f46e5;
            --accent-soft: #eef0ff;
            --listening: #e5484d;
            --processing: #d97706;
            --completed: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            padding: 40px 20px 64px;
        }

        .app {
            width: 100%;
            max-width: 640px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
        }

        .status .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #9ca3af;
        }

        .status[data-state="listening"] { color: var(--listening); }
        .status[data-state="listening"] .dot {
            background: var(--listening);
            animation: blink 1.1s ease-in-out infinite;
        }

        .status[data-state="processing"] { color: var(--processing); }
        .status[data-state="processing"] .dot {
            background: var(--processing);
            animation: blink 0.8s ease-in-out infinite;
        }

        .status[data-state="completed"] { color: var(--completed); }
        .status[data-state="completed"] .dot { background: var(--completed); }

        .status[data-state="error"] { color: var(--error); }
        .status[data-state="error"] .dot { background: var(--error); }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        .mic-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }

        .mic {
            position: relative;
            width: 132px;
            height: 132px;
            border: none;
            border-radius: 50%;
            background: transparent;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .mic:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 6px;
        }

        .mic[disabled] {
            cursor: default;
        }

        .mic .core {
            position: relative;
            z-index: 2;
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.28);
        }

        .mic:hover:not([disabled]) .core {
            transform: scale(1.03);
        }

        .mic:active:not([disabled]) .core {
            transform: scale(0.97);
        }

        .mic svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        .mic .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            z-index: 1;
        }

        .mic[data-state="listening"] .core {
            background: var(--listening);
            box-shadow: 0 8px 24px rgba(229, 72, 77, 0.3);
        }

        .mic[data-state="listening"] .ring {
            opacity: 1;
            animation: pulse 1.8s ease-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .mic[data-state="processing"] .core {
            background: var(--processing);
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.3);
            animation: none;
        }

        .mic[data-state="processing"] .core::after {
            content: "";
            position: absolute;
            inset: -11px;
            border-radius: 50%;
            border: 3px solid rgba(217, 119, 6, 0.25);
            border-top-color: var(--processing);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .mic[data-state="completed"] .core {
            background: var(--completed);
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.25);
            animation: none;
        }

        .mic[data-state="error"] .core {
            background: var(--error);
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.25);
            animation: none;
        }

        .mic .stop-icon {
            display: none;
        }

        .mic[data-state="listening"] .mic-icon {
            display: none;
        }

        .mic[data-state="listening"] .stop-icon {
            display: block;
        }

        .timer {
            font-variant-numeric: tabular-nums;
            font-size: 14px;
            color: var(--muted);
            min-height: 20px;
            letter-spacing: 0.04em;
        }

        .hint {
            font-size: 14px;
            color: var(--muted);
            text-align: center;
            min-height: 20px;
        }

        .banner {
            display: none;
            gap: 10px;
            align-items: flex-start;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .banner.visible {
            display: flex;
        }

        .banner svg {
            flex: none;
            width: 18px;
            height: 18px;
            margin-top: 1px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 16px;
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-head h2 {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
        }

        .panel-body {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            word-break: break-word;
            min-height: 24px;
        }

        .panel-body.empty {
            color: #9ca3af;
            font-size: 15px;
        }

        .panel-body.error {
            color: var(--error);
            font-size: 15px;
        }

        #transcription {
            font-size: 19px;
            line-height: 1.55;
            letter-spacing: -0.01em;
        }

        .send-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .query-input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            resize: vertical;
            min-height: 42px;
        }

        .query-input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            white-space: nowrap;
            align-self: flex-start;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .btn-primary[disabled] {
            opacity: 0.6;
            cursor: default;
        }

        .confirm-row {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .confirm-row[hidden] {
            display: none;
        }

        .confirm-sql {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            background: #f7f8fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }

        .confirm-buttons {
            display: flex;
            gap: 10px;
        }

        .table-wrap {
            overflow-x: auto;
            margin: 0 -4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #fafbfc;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td {
            max-width: 320px;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .kv {
            display: grid;
            grid-template-columns: minmax(120px, max-content) 1fr;
            gap: 8px 18px;
            font-size: 14px;
        }

        .kv dt {
            color: var(--muted);
            font-weight: 500;
        }

        .kv dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .rows {
            margin: 0;
            padding-left: 18px;
            font-size: 14px;
        }

        .rows li {
            margin-bottom: 6px;
        }

        .scalar {
            font-size: 17px;
            font-weight: 500;
        }

        .count {
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        .raw {
            margin: 12px 0 0;
            padding: 12px 14px;
            background: #f7f8fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        .empty-result {
            color: #9ca3af;
            font-size: 15px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 9px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn:hover {
            background: #f3f4f6;
            border-color: #d6d9de;
        }

        .btn[hidden] {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 28px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            body {
                padding: 28px 14px 48px;
            }

            header h1 {
                font-size: 24px;
            }

            .mic {
                width: 116px;
                height: 116px;
            }

            .mic .core {
                width: 94px;
                height: 94px;
            }

            .mic svg {
                width: 34px;
                height: 34px;
            }

            .panel {
                padding: 16px 16px;
            }

            #transcription {
                font-size: 17px;
            }

            .kv {
                grid-template-columns: 1fr;
                gap: 2px 0;
            }

            .kv dd {
                margin-bottom: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mic[data-state="listening"] .ring,
            .mic[data-state="processing"] .core::after,
            .status .dot {
                animation: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>VoiceQL</h1>
        <p>Ask your database with your voice</p>
    </header>

    <div class="status" id="status" data-state="ready">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
    </div>

    <div class="mic-area">
        <button class="mic" id="micButton" data-state="ready"
                type="button" aria-label="Start listening">
            <span class="ring"></span>
            <span class="core">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                </svg>
                <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor"
                     aria-hidden="true">
                    <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                </svg>
            </span>
        </button>

        <div class="timer" id="timer"></div>
        <div class="hint" id="hint">Tap the microphone and speak</div>
    </div>

    <div class="banner" id="banner" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="bannerText"></span>
    </div>

    <section class="panel">
        <div class="panel-head">
            <h2>Transcription</h2>
        </div>
        <div class="panel-body empty" id="transcription">
            Your speech will appear here.
        </div>
        <div class="send-row">
            <textarea class="query-input" id="queryInput" rows="2"
                placeholder="Edit the transcription here, then press Send"></textarea>
            <button class="btn btn-primary" id="sendButton" type="button">Send</button>
        </div>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>Result</h2>
            <span class="count" id="resultMeta"></span>
        </div>
        <div class="panel-body empty" id="result">
            The database result will appear here.
        </div>
        <div class="confirm-row" id="confirmRow" hidden>
            <div class="confirm-sql" id="confirmSql"></div>
            <div class="confirm-buttons">
                <button class="btn btn-primary" id="confirmButton" type="button">Confirm</button>
                <button class="btn" id="cancelButton" type="button">Cancel</button>
            </div>
        </div>
    </section>

    <div class="actions">
        <button class="btn" id="resetButton" type="button" hidden>Reset</button>
    </div>

    <footer>VoiceQL &middot; voice interface</footer>

</div>

<script>

const API_BASE = (location.protocol === "http:" || location.protocol === "https:")
    ? location.origin
    : "http://127.0.0.1:8000";
const VOICE_ENDPOINT = API_BASE + "/voice";
const ASK_ENDPOINT = API_BASE + "/ask";
const MAX_RECORDING_MS = 60000;
const COMPLETED_DELAY_MS = 2200;
const REQUEST_TIMEOUT_MS = 180000;

const STATUS_LABELS = {
    ready: "Ready",
    listening: "Listening",
    processing: "Processing",
    completed: "Completed",
    error: "Error"
};

const HINTS = {
    ready: "Tap the microphone and speak",
    listening: "Tap again to send",
    processing: "Transcribing and querying the database…",
    completed: "Done — tap the microphone to ask again",
    error: "Tap the microphone to try again"
};

const micButton = document.getElementById("micButton");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const hintEl = document.getElementById("hint");
const timerEl = document.getElementById("timer");
const banner = document.getElementById("banner");
const bannerText = document.getElementById("bannerText");
const transcriptionEl = document.getElementById("transcription");
const queryInput = document.getElementById("queryInput");
const sendButton = document.getElementById("sendButton");
const confirmRow = document.getElementById("confirmRow");
const confirmSql = document.getElementById("confirmSql");
const confirmButton = document.getElementById("confirmButton");
const cancelButton = document.getElementById("cancelButton");
let pendingQuery = "";
const resultEl = document.getElementById("result");
const resultMeta = document.getElementById("resultMeta");
const resetButton = document.getElementById("resetButton");

let state = "ready";
let mediaRecorder = null;
let mediaStream = null;
let audioContext = null;
let analyser = null;
let levelFrame = null;
let chunks = [];
let recordingStartedAt = 0;
let timerInterval = null;
let completedTimeout = null;
let recordingTimeout = null;

function setState(next) {
    state = next;
    micButton.dataset.state = next;
    statusEl.dataset.state = next;
    statusText.textContent = STATUS_LABELS[next];
    hintEl.textContent = HINTS[next];
    micButton.disabled = (next === "processing");
    micButton.setAttribute(
        "aria-label",
        next === "listening" ? "Stop and send recording" : "Start listening"
    );
    resetButton.hidden = (next === "listening" || next === "processing") ||
        (next === "ready" && !transcriptionEl.dataset.filled);
}

function showError(message) {
    bannerText.textContent = message;
    banner.classList.add("visible");
}

function clearError() {
    banner.classList.remove("visible");
    bannerText.textContent = "";
}

function setPlaceholder(el, text) {
    el.textContent = text;
    el.className = "panel-body empty";
    delete el.dataset.filled;
}

function fill(el, text) {
    el.textContent = text;
    el.className = "panel-body";
    el.dataset.filled = "1";
}

function formatTimer(ms) {
    const total = Math.floor(ms / 1000);
    const minutes = Math.floor(total / 60);
    const seconds = String(total % 60).padStart(2, "0");
    return minutes + ":" + seconds;
}

function startTimer() {
    recordingStartedAt = Date.now();
    timerEl.textContent = formatTimer(0);
    timerInterval = setInterval(() => {
        timerEl.textContent = formatTimer(Date.now() - recordingStartedAt);
    }, 250);
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.textContent = "";
}

function pickMimeType() {
    if (typeof MediaRecorder === "undefined") {
        return { mime: "", ext: "webm" };
    }
    const candidates = [
        { mime: "audio/webm;codecs=opus", ext: "webm" },
        { mime: "audio/webm", ext: "webm" },
        { mime: "audio/mp4", ext: "mp4" },
        { mime: "audio/ogg;codecs=opus", ext: "ogg" }
    ];
    for (const candidate of candidates) {
        if (MediaRecorder.isTypeSupported(candidate.mime)) {
            return candidate;
        }
    }
    return { mime: "", ext: "webm" };
}

function monitorLevel(stream) {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioContext = new AudioCtx();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        const core = micButton.querySelector(".core");

        const tick = () => {
            analyser.getByteTimeDomainData(data);
            let peak = 0;
            for (let i = 0; i < data.length; i++) {
                const value = Math.abs(data[i] - 128) / 128;
                if (value > peak) peak = value;
            }
            const scale = 1 + Math.min(peak, 1) * 0.07;
            core.style.transform = "scale(" + scale.toFixed(3) + ")";
            levelFrame = requestAnimationFrame(tick);
        };
        levelFrame = requestAnimationFrame(tick);
    } catch (err) {
        analyser = null;
    }
}

function stopMonitoring() {
    if (levelFrame) {
        cancelAnimationFrame(levelFrame);
        levelFrame = null;
    }
    const core = micButton.querySelector(".core");
    core.style.transform = "";
    if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
    }
    analyser = null;
}

function releaseStream() {
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
}

async function startListening() {
    clearError();

    if (completedTimeout) {
        clearTimeout(completedTimeout);
        completedTimeout = null;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setState("error");
        showError(
            "Microphone capture is not supported in this browser. " +
            "Please use a modern browser such as Chrome, Edge, Firefox or Safari."
        );
        return;
    }

    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });
    } catch (err) {
        setState("error");
        if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) {
            showError(
                "Microphone access was blocked. Click the camera icon in the address bar, " +
                "choose Allow, then tap the microphone again. Pick \"Allow\" rather than " +
                "\"Allow this time\" so the browser remembers your choice. If there is no " +
                "camera icon, open chrome://settings/content/microphone and add this site " +
                "to the \"Allowed to use your microphone\" list."
            );
        } else if (err && err.name === "NotFoundError") {
            showError("No microphone was found on this device.");
        } else if (err && err.name === "NotReadableError") {
            showError("Your microphone is already in use by another application.");
        } else {
            showError("Could not access the microphone: " + (err && err.message ? err.message : "unknown error"));
        }
        return;
    }

    mediaStream = stream;
    chunks = [];

    const { mime, ext } = pickMimeType();

    try {
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime })
                             : new MediaRecorder(stream);
    } catch (err) {
        releaseStream();
        setState("error");
        showError("Could not start audio recording: " + err.message);
        return;
    }

    mediaRecorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
            chunks.push(event.data);
        }
    };

    mediaRecorder.onstop = () => {
        stopTimer();
        stopMonitoring();
        releaseStream();
        sendRecording(ext);
    };

    mediaRecorder.onerror = () => {
        stopTimer();
        stopMonitoring();
        releaseStream();
        setState("error");
        showError("An error occurred while recording audio.");
    };

    setPlaceholder(transcriptionEl, "Listening for your question…");
    setPlaceholder(resultEl, "Waiting for the backend response…");
    resultMeta.textContent = "";

    mediaRecorder.start();
    monitorLevel(stream);
    startTimer();
    setState("listening");

    recordingTimeout = setTimeout(() => {
        if (state === "listening") {
            stopListening();
        }
    }, MAX_RECORDING_MS);
}

function stopListening() {
    if (recordingTimeout) {
        clearTimeout(recordingTimeout);
        recordingTimeout = null;
    }
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
    }
}

async function describeNetworkFailure() {
    const apiOrigin = new URL(VOICE_ENDPOINT).origin;
    let reachable = false;

    try {
        await fetch(apiOrigin + "/", { mode: "no-cors", cache: "no-store" });
        reachable = true;
    } catch (probeError) {
        reachable = false;
    }

    if (reachable) {
        return "The server at " + apiOrigin + " responded, but the browser blocked " +
            "this page from reading the response: the page is served from a " +
            "different origin and the API sends no CORS headers. For local testing, " +
            "relaunch the browser with --disable-web-security " +
            "--user-data-dir=\"%TEMP%\\voiceql-chrome\" and reopen this page.";
    }

    return "Could not reach the backend at " + VOICE_ENDPOINT +
        ". Check that the Django server is running, then try again.";
}

async function sendRecording(ext) {
    if (!chunks.length) {
        setState("error");
        showError("No audio was captured. Tap the microphone and speak, then tap again to send.");
        setPlaceholder(transcriptionEl, "Your speech will appear here.");
        setPlaceholder(resultEl, "The database result will appear here.");
        return;
    }

    setState("processing");
    clearError();

    const blob = new Blob(chunks, { type: mediaRecorder ? mediaRecorder.mimeType || "audio/webm" : "audio/webm" });
    chunks = [];

    const formData = new FormData();
    formData.append("audio", blob, "voice." + ext);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
        const response = await fetch(VOICE_ENDPOINT, {
            method: "POST",
            body: formData,
            credentials: "omit",
            signal: controller.signal
        });

        let data = null;
        let raw = "";
        try {
            raw = await response.text();
            data = raw ? JSON.parse(raw) : null;
        } catch (parseError) {
            data = null;
        }

        if (!response.ok) {
            throw new Error(extractErrorMessage(data, raw, response.status));
        }

        if (!data) {
            throw new Error("The backend returned an empty or invalid response.");
        }

        if (data.error) {
            throw new Error(data.error);
        }

        const text = typeof data.text === "string" ? data.text.trim() : "";

        if (!text) {
            setState("error");
            showError("No speech was recognized. Tap the microphone and speak, then tap again to send.");
            setPlaceholder(transcriptionEl, "No transcription available.");
            setPlaceholder(resultEl, "No result available.");
            resultMeta.textContent = "";
            return;
        }

        fill(transcriptionEl, text);
        queryInput.value = text;
        setPlaceholder(resultEl, "Transcription ready — press Send to query the database.");
        resultMeta.textContent = "";
        setState("ready");

    } catch (err) {
        setState("error");

        let message;
        if (err.name === "AbortError") {
            message = "The request to the backend timed out. Please try again.";
        } else if (err instanceof TypeError || (err && err.name === "TypeError")) {
            message = await describeNetworkFailure();
        } else {
            message = err.message || "The request failed.";
        }

        showError(message);
        setPlaceholder(transcriptionEl, "No transcription available.");
        setPlaceholder(resultEl, "No result available.");
        resultMeta.textContent = "";
    } finally {
        clearTimeout(timeoutId);
    }
}

function extractErrorMessage(data, raw, status) {
    if (data && typeof data.error === "string" && data.error) {
        return data.error;
    }
    if (raw && !/^\s*</.test(raw)) {
        return raw.length > 300 ? raw.slice(0, 300) + "…" : raw;
    }
    return "The backend returned an error (HTTP " + status + ").";
}

async function sendTextQuery(force, confirmed) {
    let text = queryInput.value.trim();
    if (!text && transcriptionEl.dataset.filled &&
        !transcriptionEl.classList.contains("empty")) {
        text = transcriptionEl.textContent.trim();
        queryInput.value = text;
    }
    if (!text) {
        showError("Type or dictate a question first, then press Send.");
        return;
    }
    if (!force && (state === "processing" || state === "listening")) {
        return;
    }

    setState("processing");
    clearError();
    hideConfirm();
    setPlaceholder(resultEl, "Waiting for the backend response…");
    resultMeta.textContent = "";
    fill(transcriptionEl, text);
    sendButton.disabled = true;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
        const body = { user_query: text };
        if (confirmed) {
            body.confirm = true;
        }
        const response = await fetch(ASK_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            credentials: "omit",
            signal: controller.signal
        });

        let data = null;
        let raw = "";
        try {
            raw = await response.text();
            data = raw ? JSON.parse(raw) : null;
        } catch (parseError) {
            data = null;
        }

        queryInput.value = "";
        setPlaceholder(transcriptionEl, "Sent — ask another question below.");

        if (!response.ok) {
            throw new Error(extractErrorMessage(data, raw, response.status));
        }

        if (!data) {
            throw new Error("The backend returned an empty or invalid response.");
        }

        if (data.error) {
            throw new Error(data.error);
        }

        if (data.status === "confirmation_required") {
            pendingQuery = text;
            resultEl.textContent = "";
            resultEl.className = "panel-body";
            resultEl.dataset.filled = "1";
            resultEl.appendChild(el("div", "scalar", data.message || "Please confirm to continue."));
            resultMeta.textContent = data.operation || "confirm";
            confirmSql.textContent = data.sql || "";
            confirmRow.hidden = false;
            setState("completed");

            completedTimeout = setTimeout(() => {
                if (state === "completed") {
                    setState("ready");
                }
                completedTimeout = null;
            }, COMPLETED_DELAY_MS);
            return;
        }

        renderResult(data.status !== undefined && Object.keys(data).length === 1 ? data : data);
        setState("completed");

        completedTimeout = setTimeout(() => {
            if (state === "completed") {
                setState("ready");
            }
            completedTimeout = null;
        }, COMPLETED_DELAY_MS);
    } catch (err) {
        setState("error");
        let message;
        if (err.name === "AbortError") {
            message = "The request to the backend timed out. Please try again.";
        } else if (err instanceof TypeError || (err && err.name === "TypeError")) {
            message = await describeNetworkFailure();
        } else {
            message = err.message || "The request failed.";
        }
        showError(message);
        setPlaceholder(resultEl, "No result available.");
        resultMeta.textContent = "";
    } finally {
        clearTimeout(timeoutId);
        sendButton.disabled = false;
    }
}

function hideConfirm() {
    confirmRow.hidden = true;
    confirmSql.textContent = "";
    pendingQuery = "";
}

function el(tag, className, text) {    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function isPlainObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
}

function renderTable(rows) {
    const columns = [];
    rows.forEach(row => {
        Object.keys(row).forEach(key => {
            if (columns.indexOf(key) === -1) columns.push(key);
        });
    });

    const wrap = el("div", "table-wrap");
    const table = el("table");

    const thead = el("thead");
    const headRow = el("tr");
    columns.forEach(col => headRow.appendChild(el("th", "", col)));
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el("tbody");
    rows.forEach(row => {
        const tr = el("tr");
        columns.forEach(col => {
            tr.appendChild(el("td", "", cellText(row[col])));
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    wrap.appendChild(table);
    return wrap;
}

function cellText(value) {
    if (value === null || value === undefined) return "—";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
}

function renderValue(value, container) {
    if (Array.isArray(value)) {
        if (!value.length) {
            container.appendChild(el("div", "empty-result", "Empty list."));
            return;
        }
        if (value.every(isPlainObject)) {
            container.appendChild(renderTable(value));
        } else {
            const list = el("ul", "rows");
            value.forEach(item => list.appendChild(el("li", "", cellText(item))));
            container.appendChild(list);
        }
        return;
    }

    if (isPlainObject(value)) {
        const list = el("dl", "kv");
        Object.keys(value).forEach(key => {
            list.appendChild(el("dt", "", key));
            const dd = el("dd");
            const child = value[key];
            if (Array.isArray(child) || isPlainObject(child)) {
                renderValue(child, dd);
            } else {
                dd.textContent = cellText(child);
            }
            list.appendChild(dd);
        });
        container.appendChild(list);
        return;
    }

    const scalar = el("div", "scalar", cellText(value));
    container.appendChild(scalar);
}

function renderResult(result) {
    resultEl.textContent = "";
    resultEl.className = "panel-body";
    resultEl.dataset.filled = "1";
    resultMeta.textContent = "";

    if (result === undefined) {
        setPlaceholder(resultEl, "The backend did not include a result.");
        return;
    }

    if (result === null) {
        resultEl.appendChild(el("div", "empty-result", "null"));
        return;
    }

    if (Array.isArray(result)) {
        resultMeta.textContent = result.length + (result.length === 1 ? " row" : " rows");
    } else if (isPlainObject(result)) {
        const firstKey = Object.keys(result)[0];
        if (firstKey) resultMeta.textContent = firstKey;
    }

    renderValue(result, resultEl);

    const showRaw = Array.isArray(result) && !result.every(isPlainObject);
    if (showRaw) {
        const pre = el("pre", "raw", JSON.stringify(result, null, 2));
        resultEl.appendChild(pre);
    }
}

micButton.addEventListener("click", () => {
    if (state === "listening") {
        stopListening();
        return;
    }
    if (state === "processing") {
        return;
    }
    startListening();
});

resetButton.addEventListener("click", () => {
    if (completedTimeout) {
        clearTimeout(completedTimeout);
        completedTimeout = null;
    }
    if (recordingTimeout) {
        clearTimeout(recordingTimeout);
        recordingTimeout = null;
    }
    clearError();
    resultMeta.textContent = "";
    queryInput.value = "";
    hideConfirm();
    setPlaceholder(transcriptionEl, "Your speech will appear here.");
    setPlaceholder(resultEl, "The database result will appear here.");
    setState("ready");
});

sendButton.addEventListener("click", () => sendTextQuery(false, false));

confirmButton.addEventListener("click", () => {
    if (!pendingQuery) {
        return;
    }
    queryInput.value = pendingQuery;
    sendTextQuery(true, true);
});

cancelButton.addEventListener("click", () => {
    hideConfirm();
    resultMeta.textContent = "";
    setPlaceholder(resultEl, "Operation cancelled.");
    setState("ready");
});

window.addEventListener("beforeunload", () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        try { mediaRecorder.stop(); } catch (err) {}
    }
    stopMonitoring();
    releaseStream();
});

setState("ready");

</script>

</body>
</html>
